<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="NgeLaprak Logo Icon">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#3730a3" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="nlBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a5b4fc" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#6366f1" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#312e81" stopOpacity="0.6" />
    </linearGradient>

    <!-- N Glyph Gradient -->
    <linearGradient id="nlGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#e0e7ff" />
      <stop offset="100%" stopColor="#c7d2fe" />
    </linearGradient>

    <!-- Diagonal Beam Gradient (Code Chevron) -->
    <linearGradient id="nlBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="nlSparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Dual Stroke -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#nlBgGrad)" stroke="url(#nlBorderGrad)" stroke-width="2" />

  <!-- Inner Subtle Grid Pattern for Academic Technical Feel -->
  <g opacity="0.12">
    <line x1="20" y1="35" x2="80" y2="35" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="20" y1="65" x2="80" y2="65" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="35" y1="20" x2="35" y2="80" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="65" y1="20" x2="65" y2="80" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" />
  </g>

  <!-- Document 4-4-3-3 Margin Corner Mark (Academic Touch) -->
  <path d="M16 26 L16 18 L24 18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <path d="M84 74 L84 82 L76 82" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- The Bold Geometric 'N' (Lettermark + Document Silhouette) -->
  <g>
    <!-- Left Vertical Column (Document Spine / Margin) -->
    <rect x="22" y="24" width="13" height="52" rx="4.5" fill="url(#nlGlyphGrad)" />
    <!-- Three micro-dashes representing report binding / code lines -->
    <rect x="25.5" y="32" width="6" height="2" rx="1" fill="#4338ca" opacity="0.6" />
    <rect x="25.5" y="42" width="6" height="2" rx="1" fill="#4338ca" opacity="0.6" />
    <rect x="25.5" y="52" width="6" height="2" rx="1" fill="#4338ca" opacity="0.6" />
    <rect x="25.5" y="62" width="6" height="2" rx="1" fill="#4338ca" opacity="0.6" />

    <!-- Right Vertical Column (Document Edge) -->
    <rect x="65" y="24" width="13" height="52" rx="4.5" fill="url(#nlGlyphGrad)" />

    <!-- Dynamic Diagonal Code Chevron (The N Crossbar + Compiler Accelerator) -->
    <path
      d="M26 26 L68 68 L74 68 L32 26 Z"
      fill="url(#nlBeamGrad)"
    />
  </g>

  <!-- 4-Point AI Sparkle / Quantum Compilation Star (Top Right Accent) -->
  <path
    d="M78 12 Q78 19 85 19 Q78 19 78 26 Q78 19 71 19 Q78 19 78 12 Z"
    fill="#38bdf8"
    filter="url(#nlSparkGlow)"
  />
  <circle cx="78" cy="19" r="1.5" fill="#ffffff" />
</svg>
