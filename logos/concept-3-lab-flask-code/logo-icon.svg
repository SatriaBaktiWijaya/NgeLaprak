<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="NgeLaprak Concept 3 Lab Flask">
  <defs>
    <linearGradient id="c3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="100%" stopColor="#090a0f" />
    </linearGradient>
    <linearGradient id="c3Liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#c3Bg)" stroke="#6366f1" stroke-width="2" />

  <!-- Flask Outline -->
  <path
    d="M44 20 L56 20 M50 20 L50 36 L76 74 C78 77, 76 82, 71 82 L29 82 C24 82, 22 77, 24 74 L50 36"
    stroke="#a5b4fc"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Liquid Inside Flask (The Automated Report Solution) -->
  <path
    d="M36 56 L64 56 L72 74 C73 76, 72 79, 69 79 L31 79 C28 79, 27 76, 28 74 Z"
    fill="url(#c3Liquid)"
  />

  <!-- Code brackets floating inside flask liquid -->
  <path d="M42 63 L38 67 L42 71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 63 L62 67 L58 71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="52" y1="62" x2="48" y2="72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Rising Sparkles / Bubbles -->
  <circle cx="50" cy="46" r="2.5" fill="#38bdf8" />
  <circle cx="44" cy="38" r="1.5" fill="#a5b4fc" />
  <path d="M52 24 Q52 28 56 28 Q52 28 52 32 Q52 28 48 28 Q52 28 52 24 Z" fill="#ffffff" />
</svg>
